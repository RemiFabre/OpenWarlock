<!doctype html>
<!-- B0 gate instrument (docs/BRIEF-browser-hosting.md §B0): can a 30 Hz game
     loop survive a BACKGROUNDED tab? Open one variant per tab, background them
     for 10 minutes, read window.__report(). Variants via ?v=
       interval     = plain main-thread setInterval (the naive baseline)
       worker       = a Web Worker clock posts each tick to the main thread
       worker-audio = worker clock + a quiet looping AudioContext (click Start;
                      audible-audio pages are exempt from intensive throttling)
       worker-rtc   = worker clock + an open loopback RTCPeerConnection
                      (a phase-B host has one per peer; also a documented exemption)
     Driven by tools/tabtest-run.js in HEADED Chromium with Playwright's
     throttling-disabling flags removed; run it by hand for Safari/phones. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tabtest</title>
<style>body{font:14px monospace;background:#111;color:#ddd;padding:16px}</style>
</head>
<body>
<h3 id="head">tabtest</h3>
<button id="start">Start (needed for the audio variant)</button>
<pre id="out"></pre>
<script>
const TARGET_HZ = 30;
const BUCKET_MS = 10_000;
const variant = new URLSearchParams(location.search).get('v') || 'interval';
document.getElementById('head').textContent = 'tabtest: ' + variant;

const t0 = performance.now();
const buckets = []; // per 10 s: {t: seconds-since-start, ticks, hidden}
let vis = document.visibilityState;
document.addEventListener('visibilitychange', () => { vis = document.visibilityState; });

function onTick() {
  const t = performance.now() - t0;
  const i = Math.floor(t / BUCKET_MS);
  while (buckets.length <= i) buckets.push({ t: buckets.length * BUCKET_MS / 1000, ticks: 0, hidden: vis === 'hidden' });
  buckets[i].ticks++;
  if (vis === 'hidden') buckets[i].hidden = true; // any hidden time taints the bucket
}

function workerClock() {
  const src = `setInterval(() => postMessage(0), ${1000 / TARGET_HZ});`;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  w.onmessage = onTick;
}

if (variant === 'interval') {
  setInterval(onTick, 1000 / TARGET_HZ);
} else {
  workerClock();
}

if (variant === 'worker-rtc') {
  // an open peer connection (loopback): what a phase-B host always has
  (async () => {
    const a = new RTCPeerConnection(), b = new RTCPeerConnection();
    a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
    b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
    const ch = a.createDataChannel('keepalive');
    ch.onopen = () => setInterval(() => { try { ch.send('x'); } catch { } }, 1000);
    await a.setLocalDescription(await a.createOffer());
    await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer());
    await a.setRemoteDescription(b.localDescription);
  })();
}

function startAudio() {
  // quiet but NONZERO: Chrome's exemption keys off audibility, and a
  // zero-gain page is classed silent (then throttled like any other)
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.004;
  osc.frequency.value = 50;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  document.getElementById('start').textContent = 'audio running';
}
document.getElementById('start').addEventListener('click', () => {
  if (variant === 'worker-audio') startAudio();
});
// driver mode: Chrome launched with --autoplay-policy=no-user-gesture-required,
// so the audio variant can start itself with no click
if (variant === 'worker-audio' && new URLSearchParams(location.search).get('auto') === '1') {
  try { startAudio(); } catch (e) { document.getElementById('out').textContent = 'audio failed: ' + e; }
}

window.__report = () => {
  const done = buckets.slice(0, -1); // last bucket is partial
  const hz = (b) => +(b.ticks / (BUCKET_MS / 1000)).toFixed(1);
  const hidden = done.filter(b => b.hidden);
  return {
    variant,
    visibility: document.visibilityState,
    buckets: done.map(b => ({ t: b.t, hz: hz(b), hidden: b.hidden })),
    hiddenMinHz: hidden.length ? Math.min(...hidden.map(hz)) : null,
    hiddenLastHz: hidden.length ? hz(hidden[hidden.length - 1]) : null,
  };
};

setInterval(() => {
  const r = window.__report();
  document.getElementById('out').textContent = JSON.stringify(r, null, 1);
}, 5000);

// Beacon the CUMULATIVE report home every ~15 s so a driver with no DevTools
// hook (tools/tabtest-run.js spawns a bare Chrome) still gets the numbers.
// The timer lives in a WORKER because this page's own timers are exactly the
// thing being throttled; the message event that fires the fetch is a normal
// task and is delivered even in a throttled page.
if (new URLSearchParams(location.search).get('beacon') === '1') {
  const src = 'setInterval(() => postMessage(0), 15000);';
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  w.onmessage = () => {
    try {
      fetch('/beacon?v=' + encodeURIComponent(variant), {
        method: 'POST', keepalive: true, body: JSON.stringify(window.__report()),
      }).catch(() => { });
    } catch { }
  };
}
</script>
</body>
</html>
