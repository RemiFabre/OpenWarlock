<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading OpenWarlock version…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0a0a;color:#e8dcc8;font:16px/1.5 Georgia,serif}
    main{max-width:560px;padding:28px;border-top:3px solid #699b54;background:#171210;text-align:center}
    a{color:#b7e59f}
  </style>
</head>
<body>
  <main>
    <h1>Loading this game version…</h1>
    <p id="status">Preparing its files.</p>
  </main>
  <script>
    (async () => {
      const status = document.querySelector('#status');
      const marker = 'ow-version-reload:' + location.pathname;
      const rootMatch = location.pathname.match(/^(.*\/)v\/[0-9a-f]{40}\//i);
      if (!rootMatch || !('serviceWorker' in navigator)) {
        const home = rootMatch ? rootMatch[1] + 'client/' : './client/';
        status.innerHTML = '<a href="' + home + '">Return to OpenWarlock</a>';
        return;
      }
      if (sessionStorage.getItem(marker)) {
        sessionStorage.removeItem(marker);
        status.innerHTML = 'This version could not be loaded. <a href="' + rootMatch[1] + 'client/">Return to the default game</a> and try again.';
        return;
      }
      try {
        const root = rootMatch[1];
        await navigator.serviceWorker.register(root + 'version-sw.js', { scope: root });
        await navigator.serviceWorker.ready;
        sessionStorage.setItem(marker, '1');
        location.reload();
      } catch (error) {
        status.textContent = 'This version could not be loaded: ' + error.message;
      }
    })();
  </script>
</body>
</html>
